name: Automated Release Orchestration

on:
  push:
    branches:
      - "release/v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (SemVer without v, e.g. 0.4.0)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  prepare-and-package:
    name: Verify, Promote Changelog & Package Bundle
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.semver.outputs.version }}
      tag: ${{ steps.semver.outputs.tag }}
      date: ${{ steps.semver.outputs.date }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Parse SemVer release version
        id: semver
        uses: ./.github/actions/parse_release_version
        with:
          branch_name: ${{ github.ref }}
          version_input: ${{ inputs.version }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Verify Quality Gate
        run: |
          python3 -B skills/project-scaffolder/scripts/scaffold.py --help >/dev/null
          if grep -rnI $'\r' --exclude-dir=.git --exclude-dir=__pycache__ .; then
            echo "ERROR: CRLF line endings detected!"
            exit 1
          fi

      - name: Sync Manifests & Promote Changelog
        run: |
          python3 .github/scripts/release_manager.py sync-manifests "${{ steps.semver.outputs.version }}"
          python3 .github/scripts/release_manager.py check-manifests
          python3 .github/scripts/release_manager.py update-changelog "${{ steps.semver.outputs.version }}" "${{ steps.semver.outputs.date }}"
          python3 .github/scripts/release_manager.py generate-notes "${{ steps.semver.outputs.version }}"
          python3 .github/scripts/release_manager.py update-index "${{ steps.semver.outputs.version }}" "${{ steps.semver.outputs.date }}"

      - name: Build Distributable Archive & Checksums
        run: |
          python3 .github/scripts/release_manager.py build-archive "${{ steps.semver.outputs.version }}" --out-dir dist
          (cd dist && sha256sum * > SHA256SUMS.txt)
          python3 .github/scripts/release_manager.py build-body \
            "${{ steps.semver.outputs.version }}" \
            --notes "docs/release-notes/v${{ steps.semver.outputs.version }}.md" \
            --checksums "dist/SHA256SUMS.txt" \
            --out "dist/RELEASE_BODY.md"

      - name: Commit & Push Release Updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add plugin.json gemini-extension.json .claude-plugin/plugin.json CHANGELOG.md docs/release-notes/
          git commit -m "chore(release): promote v${{ steps.semver.outputs.version }} [skip ci]" || true
          git push origin HEAD:${{ github.ref_name }} || true

      - name: Create Immutable Git Tag
        run: |
          git tag -fa "${{ steps.semver.outputs.tag }}" -m "Release ${{ steps.semver.outputs.tag }}"
          git push origin "${{ steps.semver.outputs.tag }}" --force

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.semver.outputs.tag }}
          name: "Release ${{ steps.semver.outputs.tag }}"
          body_path: dist/RELEASE_BODY.md
          files: |
            dist/*.zip
            dist/SHA256SUMS.txt
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Merge Release Updates Back to Default Branch
        if: startsWith(github.ref, 'refs/heads/release/')
        run: |
          DEFAULT_BRANCH="${{ github.event.repository.default_branch || 'main' }}"
          git fetch origin "${DEFAULT_BRANCH}:${DEFAULT_BRANCH}"
          git checkout "${DEFAULT_BRANCH}"
          git merge --ff-only "origin/${{ github.ref_name }}" || git merge -m "chore(release): merge ${{ steps.semver.outputs.tag }} back into ${DEFAULT_BRANCH} [skip ci]" "origin/${{ github.ref_name }}"
          git push origin "${DEFAULT_BRANCH}"

      - name: Delete Ephemeral Release Branch
        if: startsWith(github.ref, 'refs/heads/release/')
        run: |
          git push origin --delete "${{ github.ref_name }}"
