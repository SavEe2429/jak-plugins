default_install_hook_types:
  - pre-commit
  - commit-msg

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: detect-private-key
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ["--maxkb=1024"]
      - id: check-json
      - id: check-yaml
      - id: check-toml
      - id: mixed-line-ending
        args: ["--fix=lf"]
      - id: trailing-whitespace
        args: ["--markdown-linebreak-ext=md"]
      - id: end-of-file-fixer

  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: v0.24.0
    hooks:
      - id: markdownlint-cli2

  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.5.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
        args:
          - feat
          - fix
          - docs
          - style
          - refactor
          - perf
          - test
          - build
          - ci
          - chore
          - revert

  - repo: local
    hooks:
      - id: check-plugin-manifests
        name: Verify plugin manifest versions match
        entry: python -B .github/scripts/release/release_ops.py check-manifests
        language: system
        pass_filenames: false
        files: ^(plugin\.json|gemini-extension\.json|\.claude-plugin/plugin\.json)$

      - id: python-compile-check
        name: Compile-check Python scripts
        entry: python -B -m py_compile
        language: system
        types: [python]

      - id: verify-strict-lf
        name: Verify strict LF line endings across repository
        entry: python -B -c "import pathlib, sys; skip = {'.git', '__pycache__', '.pytest_cache', '.ruff_cache', 'dist', 'build'}; bad = [str(p) for p in sorted(pathlib.Path('.').rglob('*')) if p.is_file() and not (skip & set(p.parts)) and b'\x00' not in p.read_bytes() and b'\r' in p.read_bytes()]; print('CRLF detected:', ', '.join(bad)) if bad else None; sys.exit(1 if bad else 0)"
        language: system
        pass_filenames: false
